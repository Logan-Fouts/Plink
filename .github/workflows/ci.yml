name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/format.sh --check

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: cmake -S test -B build/test
      - run: cmake --build build/test
      - run: ctest --test-dir build/test --output-on-failure

  build:
    name: Firmware build + lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set SDK path
        run: echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            ninja-build libusb-1.0-0-dev

      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Fetch Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" \
            https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --depth 1 lib/tinyusb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (clang-tidy)
        run: scripts/lint.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: plink-firmware-${{ github.sha }}
          path: |
            build/plink.uf2
            build/plink.elf
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plink-firmware-${{ github.sha }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" plink.uf2 plink.elf \
            --repo "$GITHUB_REPOSITORY" --title "Plink $GITHUB_REF_NAME" --generate-notes
